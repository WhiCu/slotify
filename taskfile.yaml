version: '3'

silent: false

env:
  PATH_EXE: ./bin
  PATH_MAIN: ./cmd
  DIR_CONFIG: ./config
  PATH_CONFIG: "{{.DIR_CONFIG}}/config.yaml"
  APP_LOGGER_LEVEL: "debug"
  FRONTEND_VERSION: "0.1.0"
  BACKEND_VERSION: "0.1.0"

dotenv:
  - .env
  - '{{.DIR_CONFIG}}/.env'

vars:
  LOG_LEVEL: "debug"
  GOLANGCI_LINT_VERSION: "v2.12.2"

tasks:

# ── Init ──────────────────────────────────────────────────────────────────────

  init:
    desc: Set up everything needed to start working on the project
    cmds:
      - task: init:tools
      - task: init:hooks
      - go mod download
      - echo "init done"

  init:hooks:
    desc: Install git hooks (lefthook)
    cmds:
      - lefthook install

# ── Build ─────────────────────────────────────────────────────────────────────
  build:
    desc: Build main binary
    cmds:
      - go build -o {{.PATH_EXE}}/main.exe {{.PATH_MAIN}}/main.go

# ── Generate ──────────────────────────────────────────────────────────────────

  generate:
    desc: Generate code
    cmds:
      - task: generate:go
  
  generate:go:
    desc: Generate Go
    cmds:
      - go generate ./...

# ── Lint ──────────────────────────────────────────────────────────────────────

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  lint:fix:
    desc: Run golangci-lint and auto-fix what it can
    cmds:
      - golangci-lint run --fix

  lint:vuln:
    desc: Scan dependencies for known vulnerabilities
    cmds:
      - govulncheck ./...

# ── Test ──────────────────────────────────────────────────────────────────────

  test:
    desc: Test all
    env:
      CGO_ENABLED: 1
    cmds:
      - go test -v --race ./...
  test:ginkgo:
    desc: Test all with ginkgo
    cmds:
      - ginkgo run --race -r --procs=8 --tags=testcontainers --timeout=10m --randomize-all
  test:ginkgo:pprof:
    desc: Test all with ginkgo and pprof
    cmds:
      - ginkgo run --race -r --tags=testcontainers --timeout=10m --randomize-all
        --output-dir=./profiles
        --mutexprofile=mutex.out --mutexprofilefraction=1
        --blockprofile=block.out
        --memprofile=mem.out --memprofilerate=1
        --poll-progress-after=10s

# ── Air ───────────────────────────────────────────────────────────────────────

  air:
    desc: Run air (live reload)
    deps: [test]
    cmds:
      - air -d

# ── Run ───────────────────────────────────────────────────────────────────────

  run:
    desc: Run main binary
    env:
      APP_STORAGE_HOST: postgres
      APP_TELEMETRY_EXPORTER_CONN_ENDPOINT: otel-collector:4317
    cmds:
      - go run {{.PATH_MAIN}}/main.go


# ── Docker ────────────────────────────────────────────────────────────────────

  docker:build:
    desc: Build all Docker images
    cmds:
      - docker build -t slotify-backend:{{.BACKEND_VERSION}} .
      - docker build -t slotify-frontend:{{.FRONTEND_VERSION}} frontend

  docker:up:
    desc: Start full stack
    cmds:
      - docker compose up -d --wait

  docker:up:logs:
    desc: Start full stack
    cmds:
      - task: docker:up
      - task: docker:logs

  docker:build:up:logs:
    desc: Build all Docker images and start full stack and follow logs
    cmds:
      - task: docker:build
      - task: docker:up
      - task: docker:logs

  docker:down:
    desc: Stop full stack
    cmds:
      - docker compose down
  docker:down:v:
    desc: Stop full stack with volumes
    cmds:
      - docker compose down -v
  
  docker:logs:
    desc: Show logs
    cmds:
      - docker compose logs -f

 # ── Kubernetes (minikube) ─────────────────────────────────────────────────

  k8s:start:
    desc: Start 
    vars:
      CPUS: '{{.CPUS | default "8"}}'
      MEMORY: '{{.MEMORY | default "6144"}}'
    cmds:
      - minikube start --driver=docker --cpus={{.CPUS}} --memory={{.MEMORY}}

  k8s:load:
    desc: Build images and load them into minikube
    cmds:
      - task: docker:build
      - minikube image load --overwrite=true slotify-backend:{{.BACKEND_VERSION}}
      - minikube image load --overwrite=true slotify-frontend:{{.FRONTEND_VERSION}}
  k8s:load:delete:
    desc: Delete images from minikube
    cmds:
      - minikube image rm slotify-backend:{{.BACKEND_VERSION}}
      - minikube image rm slotify-frontend:{{.FRONTEND_VERSION}}

  k8s:apply:
    desc: Apply all manifests in order
    cmds:
      - kubectl apply -f k8s/namespace.yaml
      - kubectl apply -f k8s/secret.yaml
      - kubectl apply -f k8s/postgres.yaml
      - kubectl rollout status statefulset/postgres -n slotify --timeout=120s
      - kubectl apply -f k8s/backend.yaml
      - kubectl apply -f k8s/frontend.yaml
      - kubectl apply -f k8s/ingress.yaml

  k8s:deploy:
    desc: Build, load images into minikube and deploy the app
    cmds:
      - task: k8s:load
      - task: k8s:apply
  
  k8s:deploy:start:full:
    desc: Start minikube, build, load images into minikube and deploy the app
    cmds:
      - task: k8s:start
      - task: k8s:traefik
      - task: k8s:deploy

  k8s:status:
    desc: Show pods and services in slotify namespace
    cmds:
      - kubectl get pods,svc -n slotify

  k8s:scale:
    desc: "Scale app deployment (usage: task k8s:scale REPLICAS=3)"
    vars:
      REPLICAS: '{{.REPLICAS | default "3"}}'
    cmds:
      - kubectl scale deployment slotify-backend --replicas={{.REPLICAS}} -n slotify

  k8s:logs:
    desc: Follow app logs
    cmds:
      - kubectl logs -f deployment/slotify-backend -n slotify --all-pods=true --prefix=true

  k8s:pods:
    desc: Show all pods
    cmds:
      - kubectl get pods -n traefik -o wide
      - kubectl get pods -n slotify -o wide
  k8s:pods:w:
    desc: Show all pods
    cmds:
      - kubectl get pods -n slotify -o wide -w

  k8s:delete:
    desc: Delete the slotify namespace with all resources
    cmds:
      - kubectl delete namespace slotify --ignore-not-found
    
  k8s:traefik:
    desc: Install Traefik via Helm
    cmds:
      - helm repo add traefik https://traefik.github.io/charts
      - helm repo update
      - helm upgrade --install traefik traefik/traefik -n traefik --create-namespace

  k8s:tunnel:
    desc: Run minikube tunnel (keep running, may need admin rights)
    cmds:
      - minikube tunnel
  
  k8s:stop:
    desc: Stop minikube, keep all data
    cmds:
      - minikube stop
  k8s:destroy:
    desc: Delete the whole minikube cluster
    cmds:
      - minikube delete