version: '3'

silent: false

env:
  PATH_EXE: ./bin
  PATH_MAIN: ./cmd
  DIR_CONFIG: ./config
  PATH_CONFIG: "{{.DIR_CONFIG}}/config.yaml"
  APP_LOGGER_LEVEL: "debug"
  FRONTEND_VERSION: "0.1.0"
  BACKEND_VERSION: "0.1.0"

dotenv:
  - .env
  - '{{.DIR_CONFIG}}/.env'

vars:
  LOG_LEVEL: "debug"
  GOLANGCI_LINT_VERSION: "v2.12.2"

tasks:

# ── Init ──────────────────────────────────────────────────────────────────────

  init:
    desc: Set up everything needed to start working on the project
    cmds:
      - task: init:tools
      - task: init:hooks
      - go mod download
      - echo "init done"

  init:hooks:
    desc: Install git hooks (lefthook)
    cmds:
      - lefthook install

# ── Build ─────────────────────────────────────────────────────────────────────
  build:
    desc: Build main binary
    cmds:
      - go build -o {{.PATH_EXE}}/main.exe {{.PATH_MAIN}}/main.go

# ── Generate ──────────────────────────────────────────────────────────────────

  generate:
    desc: Generate code
    cmds:
      - task: generate:go
  
  generate:go:
    desc: Generate Go
    cmds:
      - go generate ./...

# ── Lint ──────────────────────────────────────────────────────────────────────

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  lint:fix:
    desc: Run golangci-lint and auto-fix what it can
    cmds:
      - golangci-lint run --fix

  lint:vuln:
    desc: Scan dependencies for known vulnerabilities
    cmds:
      - govulncheck ./...

# ── Test ──────────────────────────────────────────────────────────────────────

  test:
    desc: Test all
    env:
      CGO_ENABLED: 1
    cmds:
      - go test -v --race ./...
  test:ginkgo:
    desc: Test all with ginkgo
    cmds:
      - ginkgo run --race -r --procs=8 --tags=testcontainers --timeout=10m --randomize-all
  test:ginkgo:pprof:
    desc: Test all with ginkgo and pprof
    cmds:
      - ginkgo run --race -r --tags=testcontainers --timeout=10m --randomize-all
        --output-dir=./profiles
        --mutexprofile=mutex.out --mutexprofilefraction=1
        --blockprofile=block.out
        --memprofile=mem.out --memprofilerate=1
        --poll-progress-after=10s

# ── Air ───────────────────────────────────────────────────────────────────────

  air:
    desc: Run air (live reload)
    deps: [test]
    cmds:
      - air -d

# ── Run ───────────────────────────────────────────────────────────────────────

  run:
    desc: Run main binary
    env:
      APP_STORAGE_HOST: postgres
      APP_TELEMETRY_EXPORTER_CONN_ENDPOINT: otel-collector:4317
    cmds:
      - go run {{.PATH_MAIN}}/main.go


# ── Docker ────────────────────────────────────────────────────────────────────

  docker:build:
    desc: Build all Docker images
    cmds:
      - docker build -t slotify-backend:{{.BACKEND_VERSION}} .
      - docker build -t slotify-frontend:{{.FRONTEND_VERSION}} frontend

  docker:up:
    desc: Start full stack
    cmds:
      - docker compose up -d --wait

  docker:up:logs:
    desc: Start full stack
    cmds:
      - task: docker:up
      - task: docker:logs

  docker:build:up:logs:
    desc: Build all Docker images and start full stack and follow logs
    cmds:
      - task: docker:build
      - task: docker:up
      - task: docker:logs

  docker:down:
    desc: Stop full stack
    cmds:
      - docker compose down
  docker:down:v:
    desc: Stop full stack with volumes
    cmds:
      - docker compose down -v
  
  docker:logs:
    desc: Show logs
    cmds:
      - docker compose logs -f

 # ── Kubernetes (minikube) ─────────────────────────────────────────────────
 # ── Minikube & Кластер ──────────────────────────────────────────────────
  k8s:start:
    desc: Start Minikube cluster
    vars:
      CPUS: '{{.CPUS | default "8"}}'
      MEMORY: '{{.MEMORY | default "6144"}}'
    cmds:
      - minikube start --driver=docker --cpus={{.CPUS}} --memory={{.MEMORY}}

  k8s:stop:
    desc: Stop Minikube cluster (preserves data)
    cmds:
      - minikube stop

  k8s:destroy:
    desc: Delete Minikube cluster completely
    cmds:
      - minikube delete

  k8s:tunnel:
    desc: Open Minikube network tunnel (keep open in separate terminal)
    cmds:
      - minikube tunnel

  k8s:images:load:
    desc: Build Docker images and load them into Minikube
    cmds:
      - task: docker:build
      - minikube image load --overwrite=true slotify-backend:{{.BACKEND_VERSION}}
      - minikube image load --overwrite=true slotify-frontend:{{.FRONTEND_VERSION}}

  k8s:images:clean:
    desc: Remove local application images from Minikube
    cmds:
      - minikube image rm slotify-backend:{{.BACKEND_VERSION}}
      - minikube image rm slotify-frontend:{{.FRONTEND_VERSION}}

  k8s:pods:
    desc: List pods across all active project namespaces
    cmds:
      - kubectl get pods -n traefik -o wide
      - kubectl get pods -n metrics -o wide
      - kubectl get pods -n storage -o wide
      - kubectl get pods -n slotify -o wide

  k8s:pods:watch:
    desc: Live watch pods status in slotify namespace
    cmds:
      - kubectl get pods -n slotify -o wide -w
  
  k8s:logs:prev:
    desc: "Show logs from previous (crashed) container instance (usage: task k8s:logs:prev ID=<pod-name> [NS=slotify])"
    vars:
      ID: '{{.ID | default .POD}}'
      NS: '{{.NS | default "slotify"}}'
    cmds:
      - kubectl logs {{.ID}} -n {{.NS}} --previous
  
  k8s:logs:
    desc: "Show logs from container instance (usage: task k8s:logs ID=<pod-name> [NS=slotify])"
    vars:
      ID: '{{.ID | default .POD}}'
      NS: '{{.NS | default "slotify"}}'
    cmds:
      - kubectl logs {{.ID}} -n {{.NS}}
  
  # ── Helm: Traefik (namespace: traefik) ──────────────────────────────────

  helm:traefik:apply:
    desc: Install or update Traefik Ingress Controller
    cmds:
      - helm repo add traefik https://traefik.github.io/charts
      - helm repo update traefik
      - |
        helm upgrade --install traefik traefik/traefik \
          -n traefik --create-namespace \
          --wait --timeout 5m

  helm:traefik:uninstall:
    desc: Remove Traefik Ingress Controller
    cmds:
      - helm uninstall traefik -n traefik
  # ── Helm: Metrics Stack (namespace: metrics) ────────────────────────────

  helm:metrics:deps:
    desc: Update dependencies for metrics chart
    cmds:
      - helm dependency update helm/metrics

  helm:metrics:template:
    desc: Render metrics manifests
    cmds:
      - helm template metrics helm/metrics -n metrics --debug

  helm:metrics:apply:
    desc: Deploy VictoriaLogs and OpenTelemetry Collector
    cmds:
      - |
        helm upgrade --install metrics helm/metrics \
          -n metrics --create-namespace \
          --wait --timeout 5m

  helm:metrics:uninstall:
    desc: Remove metrics stack
    cmds:
      - helm uninstall metrics -n metrics
  
  helm:metrics:logs:collector:
    desc: Follow VictoriaLogs and OpenTelemetry Collector logs
    vars:
      N: '{{.N | default 100}}'
    cmds:
      - kubectl logs -n metrics deployment/otel-collector --tail={{.N}}

  # ── Helm: Slotify Application (namespace: slotify) ──────────────────────

  helm:slotify:template:
    desc: Render slotify application manifests
    cmds:
      - |
        helm template slotify helm/slotify \
          -n slotify \
          --debug \
          -f helm/slotify/values.yaml \
          --set backend.tag={{.BACKEND_VERSION}} \
          --set frontend.tag={{.FRONTEND_VERSION}}

  helm:slotify:apply:
    desc: Deploy slotify application via Helm
    cmds:
      - |
        helm upgrade --install slotify helm/slotify \
          -n slotify --create-namespace \
          -f helm/slotify/values.yaml \
          --set backend.tag={{.BACKEND_VERSION}} \
          --set frontend.tag={{.FRONTEND_VERSION}} \
          --wait --timeout 5m

  helm:slotify:uninstall:
    desc: Remove slotify application Helm release
    cmds:
      - helm uninstall slotify -n slotify

  # ── Kubernetes: Управление и отладка (namespace: slotify) ───────────────

  k8s:slotify:status:
    desc: Show pods, services and statefulsets in slotify namespace
    cmds:
      - kubectl get pods,svc,sts,pvc -n slotify

  k8s:slotify:logs:
    desc: Follow backend application logs
    vars:
      REPLICAS: '{{.REPLICAS | default "3"}}'
    cmds:
      - kubectl logs -f deployment/slotify-backend -n slotify --all-pods=true --prefix=true

  k8s:slotify:scale:
    desc: "Scale backend deployment (usage: task k8s:slotify:scale REPLICAS=3)"
    vars:
      REPLICAS: '{{.REPLICAS | default "3"}}'
    cmds:
      - kubectl scale deployment slotify-backend --replicas={{.REPLICAS}} -n slotify

  k8s:slotify:clean:
    desc: Delete the slotify namespace and all its resources
    cmds:
      - kubectl delete namespace slotify --ignore-not-found

  # ── Helm: Storage / PostgreSQL (namespace: storage) ─────────────────────

  helm:storage:deps:
    desc: Download and update Helm chart dependencies (Bitnami PostgreSQL)
    cmds:
      - helm dependency update helm/storage

  helm:storage:template:
    desc: Render storage manifests for debugging
    cmds:
      - |
        helm template storage helm/storage \
          -n storage \
          --debug \
          -f helm/storage/values.yaml

  helm:storage:apply:
    desc: Deploy PostgreSQL storage via Helm
    cmds:
      - |
        helm upgrade --install storage helm/storage \
          -n storage --create-namespace \
          -f helm/storage/values.yaml \
          --wait --timeout 5m

  helm:storage:uninstall:
    desc: Remove PostgreSQL storage Helm release
    cmds:
      - helm uninstall storage -n storage

  # ── Kubernetes: Управление и отладка (namespace: storage) ───────────────

  k8s:storage:status:
    desc: Show pods, services, statefulsets and PVCs in storage namespace
    cmds:
      - kubectl get pods,svc,sts,pvc -n storage

  k8s:storage:logs:
    desc: "Follow PostgreSQL logs (usage: task k8s:storage:logs [CONTAINER=postgresql|metrics])"
    vars:
      CONTAINER: '{{.CONTAINER | default "postgresql"}}'
    cmds:
      - kubectl logs -f statefulset/postgres -n storage -c {{.CONTAINER}}

  k8s:storage:clean:
    desc: Delete the storage namespace and all its resources (including PVCs)
    cmds:
      - kubectl delete namespace storage --ignore-not-found

  # ── Сценарии комплексного деплоя ────────────────────────────────────────

  k8s:deploy:slotify:
    desc: Build, load images and deploy only the slotify application
    cmds:
      - task: k8s:images:load
      - task: helm:slotify:apply
  
  k8s:deps:update:
    desc: Build, load images and deploy only the metrics stack
    cmds:
      - task: helm:metrics:deps
      - task: helm:storage:deps
      

  k8s:deploy:full:
    desc: Full cold start (Minikube -> Traefik -> Metrics -> Storage -> App)
    cmds:
      - task: k8s:start
      - task: helm:traefik:apply
      - task: helm:metrics:apply
      - task: helm:storage:apply
      - task: k8s:deploy:slotify
      - task: k8s:tunnel