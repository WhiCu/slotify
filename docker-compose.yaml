services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: slotify-backend:${BACKEND_VERSION:?BACKEND_VERSION не задан}
    container_name: slotify
    env_file:
      - config/.env
    environment:
      APP_STORAGE__HOST: postgres
      APP_STORAGE__USER: ${DB_USER:-postgres}
      APP_STORAGE__PASS: ${DB_PASS:-postgres}
      APP_STORAGE__NAME: ${DB_NAME:-slotify}
      APP_TELEMETRY__EXPORTER__CONN__ENDPOINT: otel-collector:4317
      APP_HTTP__CORS__ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - ./config:/src/config:ro
      - app_logs:/src/logs
    depends_on:
      postgres:
        condition: service_healthy
      # otel-collector:
      #   condition: service_started
    networks:
      - slotify-net
  
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: slotify-frontend:${FRONTEND_VERSION:?FRONTEND_VERSION не задан}
    container_name: slotify-frontend
    ports:
      - "3000:80"
    depends_on:
      - app
    networks:
      - slotify-net
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-slotify}
    env_file:
      - config/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - slotify-net

  # otel-collector:
  #   image: otel/opentelemetry-collector
  #   container_name: otel-collector
  #   volumes:
  #     - ./otelcol/config.yaml:/etc/otelcol-contrib/config.yaml:ro
  #   ports:
  #     - "1888:1888"   # pprof extension
  #     - "13133:13133" # health_check extension
  #     - "4317:4317"   # OTLP gRPC receiver
  #     - "4318:4318"   # OTLP http receiver
  #     - "55679:55679" # zpages extension
  #   networks:
  #     - slotify-net

volumes:
  postgres_data:
  app_logs:

networks:
  slotify-net:
    driver: bridge