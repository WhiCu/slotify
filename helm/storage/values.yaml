postgresql:
  fullnameOverride: "postgres"

  auth:
    username: postgres
    password: postgres
    database: slotify

  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

    extendedConfiguration: |
      # ─── Logging [https://postgrespro.ru/docs/postgrespro/18/runtime-config-logging] ────────────────── 
      log_destination = 'stderr'
      log_line_prefix = '%m [%p] %q%u@%d '
      log_min_duration_statement = '1s'
      log_lock_waits = on
      log_autovacuum_min_duration = '1s'
      log_statement = 'all'
      log_min_error_statement = 'warning'
      log_parameter_max_length = 0
      log_parameter_max_length_on_error = 0
      log_error_verbosity = 'default'

    startupProbe:
      enabled: true
    
  metrics:
    enabled: true

    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 128Mi