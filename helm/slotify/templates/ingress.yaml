apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
  namespace: {{ .Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: slotify
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.host }}`) && PathPrefix(`/api/`)
      kind: Rule
      middlewares:
        - name: strip-api
      services:
        - name: slotify-backend
          port: 8080
    - match: Host(`{{ .Values.host }}`)
      kind: Rule
      services:
        - name: slotify-frontend
          port: 80