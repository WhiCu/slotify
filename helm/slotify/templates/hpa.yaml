apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: slotify-backend-hpa
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: slotify-backend
  minReplicas: {{ .Values.backend.replicas.min }}
  maxReplicas: {{ .Values.backend.replicas.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60

# desiredReplicas = currentReplicas * (currentMetricValue/desiredMetricValue)