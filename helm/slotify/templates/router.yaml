apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slotify
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: gateway
      namespace: router
      sectionName: web
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: slotify-backend
          port: 8080

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: slotify-frontend
          port: 80