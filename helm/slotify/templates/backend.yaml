apiVersion: apps/v1
kind: Deployment
metadata:
  name: slotify-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: slotify-backend
  template:
    metadata:
      labels:
        app: slotify-backend
      annotations:
        prometheus.io/scrape: {{ .Values.telemetry.enabled | quote }}
        prometheus.io/port: {{ .Values.backend.http.port | quote }}
        prometheus.io/path: {{ .Values.telemetry.prometheus.path | quote }}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: slotify-backend
          image: {{ .Values.backend.image }}:{{ .Values.backend.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.backend.http.port }}
          envFrom:
            - configMapRef:
                name: slotify-app
            - secretRef:
                name: slotify-app
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu }}
              memory: {{ .Values.backend.resources.requests.memory }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu }}
              memory: {{ .Values.backend.resources.limits.memory }}
          startupProbe:
            httpGet:
              path: "/ping"
              port: {{ .Values.backend.http.port }}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: "/ping"
              port: {{ .Values.backend.http.port }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: "/ping"
              port: {{ .Values.backend.http.port }}
            periodSeconds: 20
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: slotify-backend
  namespace: {{ .Release.Namespace }}
  annotations:
    healthcheck/enabled: {{ .Values.backend.http.healthCheck.enabled | quote }}
    healthcheck/path: {{ .Values.backend.http.healthCheck.path | quote }}
    healthcheck/port: {{ .Values.backend.http.port | quote }}
spec:
  selector:
    app: slotify-backend
  ports:
    - port: {{ .Values.backend.http.port }}
      targetPort: {{ .Values.backend.http.port }}