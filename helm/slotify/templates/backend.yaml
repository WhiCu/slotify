apiVersion: apps/v1
kind: Deployment
metadata:
  name: slotify-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: slotify-backend
  template:
    metadata:
      labels:
        app: slotify-backend
      annotations:
        prometheus.io/scrape: {{ .Values.telemetry.enabled | quote }}
        prometheus.io/port: {{ .Values.backend.http.port | quote }}
        prometheus.io/path: {{ .Values.telemetry.prometheus.path | quote }}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: slotify-backend
          image: {{ .Values.backend.image }}:{{ .Values.backend.tag }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: slotify-app
            - secretRef:
                name: slotify-app
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu }}
              memory: {{ .Values.backend.resources.requests.memory }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu }}
              memory: {{ .Values.backend.resources.limits.memory }}
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: slotify-backend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: slotify-backend
  ports:
    - port: 8080
      targetPort: 8080