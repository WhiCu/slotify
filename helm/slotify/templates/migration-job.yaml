apiVersion: batch/v1
kind: Job
metadata:
  name: slotify-migration
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: slotify-migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Values.postgres.host }} -p {{ .Values.postgres.port }} -U {{ .Values.postgres.user }}; do
                echo "Waiting for PostgreSQL at {{ .Values.postgres.host }}..."
                sleep 2
              done
      containers:
        - name: migration
          image: {{ .Values.backend.image }}:{{ .Values.backend.tag | default "latest" }}
          imagePullPolicy: IfNotPresent
          command: ["/src/bin/main"]
          args: ["-v", "--up-migrate"]
          envFrom:
            - configMapRef:
                name: slotify-app
            - secretRef:
                name: slotify-app
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu }}
              memory: {{ .Values.backend.resources.requests.memory }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu }}
              memory: {{ .Values.backend.resources.limits.memory }}