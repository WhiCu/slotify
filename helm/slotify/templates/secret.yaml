apiVersion: v1
kind: Secret
metadata:
  name: slotify-db
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.db | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: slotify-app
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  APP_STORAGE__USER: {{ .Values.postgres.user | quote }}
  APP_STORAGE__PASS: {{ .Values.postgres.password | quote }}

  APP_CRYPTO__HMAC_SECRET: {{ .Values.backend.crypto.hmacSecret | quote }}
  APP_CRYPTO__PASETO__SYMMETRIC_KEY: {{ .Values.backend.crypto.pasetoSymmetricKey | quote }}
  APP_CRYPTO__PASETO__SECRET_KEY: {{ .Values.backend.crypto.pasetoSecretKey | quote }}