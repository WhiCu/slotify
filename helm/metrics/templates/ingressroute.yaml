apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: metrics-services
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.local`)
      kind: Rule
      services:
        - name: grafana
          port: 80

    - match: Host(`logs.local`)
      kind: Rule
      services:
        - name: victoria-logs-server
          port: 9428
    
    - match: Host(`metrics.local`)
      kind: Rule
      services:
        - name: victoria-metrics-server
          port: 8428

    - match: Host(`jaeger.local`)
      kind: Rule
      services:
        - name: jaeger
          port: 16686