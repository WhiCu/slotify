# ── VictoriaLogs ──────────────────────────────────────────────────────────
victorialogs:
  enabled: true
  fullnameOverride: "victoria-logs"
  server:
    persistentVolume:
      size: 2Gi

# ── OpenTelemetry Collector ──────────────────────────────────────────────
otelcollector:
  enabled: true
  fullnameOverride: "otel-collector"
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
  presets:
    kubernetesAttributes:
      enabled: true
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: "postgres"
              scrape_interval: 15s
              static_configs:
                - targets: ["postgres-metrics.storage.svc:9187"]
    extensions:
      health_check:
    exporters:
      otlphttp/victorialogs:
        logs_endpoint: http://victoria-logs-server:9428/insert/opentelemetry/v1/logs
      debug:
        verbosity: detailed
        sampling_initial: 5
    processors:
      batch:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/victorialogs, debug]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch]
          exporters: [debug]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
