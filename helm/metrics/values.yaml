# ── VictoriaLogs ──────────────────────────────────────────────────────────
victorialogs:
  enabled: true
  fullnameOverride: "victoria-logs"
  server:
    persistentVolume:
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

# ── VictoriaMetrics ──────────────────────────────────────────────────────
victoriametrics:
  enabled: true
  fullnameOverride: "victoria-metrics"
  server:
    persistentVolume:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

# ── OpenTelemetry Collector ──────────────────────────────────────────────
otelcollector:
  enabled: true
  fullnameOverride: "otel-collector"
  mode: daemonset
  image:
    repository: otel/opentelemetry-collector-contrib
  
  service:
    enabled: true
    internalTrafficPolicy: Local

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  presets:
    kubernetesAttributes:
      enabled: true
      extractAllPodLabels: false
    logsCollection:
      enabled: true
      includeCollectorLogs: false
      storeCheckpoints: true
    # kubeletMetrics:
    #   enabled: true
    # clusterMetrics:
    #   enabled: true
    # hostMetrics:
    #   enabled: true

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: "postgres"
              scrape_interval: 15s
              static_configs:
                - targets: ["postgres-metrics.storage.svc:9187"]

            - job_name: "kubernetes-pods"
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - action: keep
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: "true"
                - action: replace
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  target_label: __metrics_path__
                  regex: (.+)
                - action: replace
                  source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  target_label: __address__
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $1:$2
      filelog:
        include: [/var/log/pods/*/*/*.log]
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser

          - type: json_parser
            id: k8s-json
            if: 'resource["k8s.namespace.name"] == "kube-system" && resource["k8s.container.name"] in ["kube-apiserver", "kube-controller-manager", "kube-scheduler"] && body matches "^\\{.*\\}$"'

          - type: add
            id: k8s-json-level
            if: 'attributes.ts != nil && attributes.msg != nil'
            field: attributes.level
            value: 'EXPR(attributes.err != nil ? "error" : "info")'

          - type: severity_parser
            id: k8s-json-severity
            if: 'attributes.ts != nil && attributes.msg != nil'
            parse_from: attributes.level

          - type: recombine
            id: postgres-recombine
            if: 'resource["k8s.container.name"] == "postgresql"'
            combine_field: body
            is_first_entry: 'body matches "^\\d{4}-\\d{2}-\\d{2} \\d{2}:"'
            source_identifier: attributes["log.file.path"]
            combine_with: "\n"
            max_log_size: 1048576

          - type: regex_parser
            id: postgres-parser
            if: 'resource["k8s.container.name"] == "postgresql" && body matches "^\\d{4}-\\d{2}-\\d{2} "'
            regex: '(?s)^(?P<pg_time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+ \S+) \[(?P<pid>\d+)\] ?(?:(?P<db_user>[^@\s]*)@(?P<db_name>\S*) )?(?P<pg_level>[A-Z0-9]+):\s+(?P<message>.*)$'
            timestamp:
              parse_from: attributes.pg_time
              layout_type: gotime
              layout: '2006-01-02 15:04:05.999 MST'
            severity:
              parse_from: attributes.pg_level
              mapping:
                debug: [DEBUG1, DEBUG2, DEBUG3, DEBUG4, DEBUG5]
                info: [LOG, INFO, NOTICE, STATEMENT, DETAIL, HINT, CONTEXT, QUERY]
                warn: WARNING
                error: ERROR
                fatal: [FATAL, PANIC]
                

          - type: json_parser
            id: backend-json
            if: 'body matches "^\\{.*\\}$"'
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z07:00'
            severity:
              parse_from: attributes.level

          - type: trace_parser
            if: 'attributes.trace_id != nil'
            trace_id: {parse_from: attributes.trace_id}
            span_id: {parse_from: attributes.span_id}
          
          - type: add
            id: level-from-severity
            if: 'severity > 0 && attributes.level == nil'
            field: attributes.level
            value: 'EXPR(severity >= 21 ? "critical" : severity >= 17 ? "error" : severity >= 13 ? "warn" : severity >= 9 ? "info" : "debug")'

          - type: move
            id: msg-to-body
            if: 'attributes.msg != nil && attributes.message == nil'
            from: attributes.msg
            to: body
          
          - type: move
            if: 'attributes.message != nil'
            from: attributes.message
            to: body

    extensions:
      health_check:

    exporters:
      otlphttp/victoriametrics:
        metrics_endpoint: "http://victoria-metrics-server:8428/opentelemetry/v1/metrics"
        tls:
          insecure: true
      otlphttp/victorialogs:
        logs_endpoint: http://victoria-logs-server:9428/insert/opentelemetry/v1/logs
        headers:
          VL-Ignore-Fields: k8s.pod.start_time,k8s.replicaset.uid,k8s.cluster.uid
      debug:
        verbosity: detailed
        sampling_initial: 5
      otlp/jaeger:
        endpoint: "jaeger:4317"
        tls:
          insecure: true
  
    processors:
      batch:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
  
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/victorialogs, debug]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/victoriametrics, debug]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger, debug]

# ── Grafana ───────────────────────────────────────────────────────────────
grafana:
  enabled: true
  fullnameOverride: "grafana"
  adminPassword: "admin"
  plugins:
    - victoriametrics-logs-datasource
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: VictoriaLogs
          uid: victorialogs
          type: victoriametrics-logs-datasource
          access: proxy
          url: http://victoria-logs-server:9428
          editable: true
        - name: Jaeger
          type: jaeger
          access: proxy
          url: http://jaeger:16686
          editable: true
  alerting:
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: slotify-alerts
          folder: Slotify
          interval: 1m
          rules:
            - uid: slotify-backend-errors
              title: Slotify Backend Error Logs Detected
              condition: C
              noDataState: OK
              execErrState: Error
              for: 1m
              data:
                - refId: A
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: victorialogs
                  model:
                    refId: A
                    datasource:
                      type: victoriametrics-logs-datasource
                      uid: victorialogs
                    expr: 'severity_number:in("17", "18", "19", "20") | stats by () count() as errors'
                    queryType: statsRange
                - refId: C
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    conditions:
                      - evaluator:
                          type: gt
                          params: [5]
              annotations:
                summary: "Backend errors detected in logs"
              labels:
                severity: warning
# ── Jaeger (In-memory трейсинг для Minikube) ─────────────────────────────
jaeger:
  enabled: true
  fullnameOverride: "jaeger"
  provisionDataStore:
    cassandra: false
  allInOne:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  storage:
    type: memory
  collector:
    enabled: false
  query:
    enabled: false
  agent:
    enabled: false  