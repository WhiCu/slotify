apiVersion: apps/v1
kind: Deployment
metadata:
  name: slotify-backend
  namespace: slotify
spec:
  replicas: 3
  selector:
    matchLabels:
      app: slotify-backend
  template:
    metadata:
      labels:
        app: slotify-backend
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: slotify-backend
          image: slotify-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: slotify-app
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 20
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: slotify-backend
  namespace: slotify
spec:
  selector:
    app: slotify-backend
  ports:
    - port: 8080
      targetPort: 8080