apiVersion: apps/v1
kind: Deployment
metadata:
  name: slotify-frontend
  namespace: slotify
spec:
  replicas: 3
  selector:
    matchLabels:
      app: slotify-frontend
  template:
    metadata:
      labels:
        app: slotify-frontend
    spec:
      enableServiceLinks: false
      containers:
        - name: slotify-frontend
          image: slotify-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: slotify-frontend
  namespace: slotify
spec:
  type: NodePort
  selector:
    app: slotify-frontend
  ports:
    - port: 80
      targetPort: 80