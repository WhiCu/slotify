apiVersion: v1
kind: Secret
metadata:
  name: slotify-db
  namespace: slotify
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: slotify

---
apiVersion: v1
kind: Secret
metadata:
  name: slotify-app
  namespace: slotify
type: Opaque
stringData:
  APP_STORAGE__HOST: postgres
  APP_STORAGE__USER: postgres
  APP_STORAGE__PASS: postgres
  APP_STORAGE__NAME: slotify
  APP_HTTP__CORS__ALLOWED_ORIGINS: "http://slotify.local"